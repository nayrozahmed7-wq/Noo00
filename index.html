<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>علي ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#ffffff;font-family:'Cairo',Arial;text-align:center}
.top{position:relative;width:100%;height:78vh;overflow:hidden}
.top img{width:100%;height:100%;object-fit:cover;display:block}
.top .overlay{position:absolute;inset:0;background:linear-gradient(to top, rgba(0,0,0,0.65), rgba(0,0,0,0.05) 55%)}
.top .small{position:absolute;bottom:165px;left:0;right:0;color:#fff;font-size:20px;letter-spacing:3px;text-shadow:0 2px 10px rgba(0,0,0,0.9)}
.top .name{position:absolute;bottom:25px;left:0;right:0;color:white;font-family:'Aref Ruqaa',serif;font-size:115px;line-height:1;text-shadow:0 4px 20px rgba(0,0,0,0.9)}
.top .deco{position:absolute;bottom:8px;left:0;right:0;color:#ffb3c6;font-size:22px;letter-spacing:8px}
.content{padding:28px 22px 40px;background:white}
.content h2{font-family:'Aref Ruqaa',serif;font-size:48px;color:#222;margin-bottom:8px}
.content p{font-size:19px;line-height:2;color:#444}
.heart{font-size:45px;margin:12px 0}
button{background:#ff2e63;color:white;border:none;padding:16px 30px;border-radius:50px;font-size:19px;margin-top:15px;font-family:'Cairo'}
</style>
</head>
<body>
<div class="top">
  <img src="https://i.postimg.cc/T1BZcZPY/1785962077552.png">
  <div class="overlay"></div>
  <div class="small">To My Sweet Boy</div>
  <div class="name">عــلــي</div>
  <div class="deco">✦ ❤️ ✦</div>
</div>
<div class="content">
  <div class="heart">❤️</div>
  <h2>بــحــبــك يــا عــلــي</h2>
  <p>انت أحلى حاجة حصلتلي في حياتي<br>كل يوم معاك بيبقى أحلى من اللي قبله<br>وهفضل أحبك على طول</p>
  <p style="margin-top:15px"><b>- من نوزا</b></p>
  <button onclick="alert('بحبك يا علي ❤️')">دوس هنا يا علي</button>
</div>
</body>
</html>
